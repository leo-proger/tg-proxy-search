name: Update public proxy list

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-public-proxy-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.3"

      - name: Install dependencies
        run: uv sync --locked

      - name: Restore Telethon session
        shell: bash
        env:
          TELETHON_SESSION_BASE64: ${{ secrets.TELETHON_SESSION_BASE64 }}
        run: |
          if [[ -z "${TELETHON_SESSION_BASE64}" ]]; then
            echo "TELETHON_SESSION_BASE64 secret is not configured" >&2
            exit 1
          fi
          session_file="${RUNNER_TEMP}/telethon.session"
          printf '%s' "${TELETHON_SESSION_BASE64}" | base64 --decode > "${session_file}"
          chmod 600 "${session_file}"
          echo "TELETHON_SESSION_FILE=${session_file}" >> "${GITHUB_ENV}"

      - name: Update public list
        run: uv run python -m tg_proxy_search.update_public_proxies

      - name: Validate public list
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from tg_proxy_search.public_list import read_proxy_urls, validate_proxy_urls

          urls = read_proxy_urls(Path("proxies.txt"))
          validate_proxy_urls(urls, limit=1000)
          print(f"Validated {len(urls)} proxy URLs")
          PY

      - name: Commit updated list
        shell: bash
        run: |
          if git diff --quiet -- proxies.txt; then
            echo "Proxy list has not changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxies.txt
          git commit -m "chore: update public proxy list"
          git push origin HEAD:main
